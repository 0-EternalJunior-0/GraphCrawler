<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page with Rich Metadata</title>
    <meta name="description" content="This page has rich metadata for testing">
    <meta name="keywords" content="metadata, test, crawl, seo">
    <meta name="author" content="Test Author">
    <meta property="og:title" content="Open Graph Title">
    <meta property="og:description" content="Open Graph Description">
    <meta property="og:image" content="https://example.com/image.jpg">
    <meta name="twitter:card" content="summary_large_image">
    
    <!-- SEO Crawler Metadata -->
    <link rel="canonical" href="https://example.com/canonical-page">
    <meta name="robots" content="index, follow, max-snippet:150">
    <meta name="googlebot" content="index, follow, max-image-preview:large">
    <meta name="bingbot" content="index, follow">
    
    <!-- Hreflang для локалізацій -->
    <link rel="alternate" hreflang="en" href="https://example.com/en/page">
    <link rel="alternate" hreflang="uk" href="https://example.com/uk/page">
    <link rel="alternate" hreflang="de" href="https://example.com/de/page">
    <link rel="alternate" hreflang="x-default" href="https://example.com/page">
</head>
<body>
    <h1>Page with Metadata</h1>
    <h2>Subtitle</h2>
    <p>This page tests metadata extraction capabilities.</p>
    <a href="/meta/page1">Meta Page 1</a>
    <a href="/meta/page2">Meta Page 2</a>
</body>
</html>
